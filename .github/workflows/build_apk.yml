name: Build Dual Audio Radio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build App Project
        run: |
          mkdir -p native_app/app/src/main/java/com/sagar/airfm
          mkdir -p native_app/app/src/main/res/values
          mkdir -p native_app/app/src/main/assets

          # 1. gradle.properties
          cat << 'EOF' > native_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. settings.gradle
          cat << 'EOF' > native_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIR FM Rainbow"
          include ':app'
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > native_app/build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
          }
          EOF

          # 4. App-level build.gradle
          cat << 'EOF' > native_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sagar.airfm'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sagar.airfm"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
              implementation 'androidx.media3:media3-session:1.3.1'
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > native_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 6. RadioService.java (Fixed Multi-App Sound Slider & Synced Live Notification Seekbar)
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/RadioService.java
          package com.sagar.airfm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioManager;
          import android.os.Binder;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackParameters;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;

          public class RadioService extends Service {
              public static final String ACTION_TOGGLE = "com.sagar.airfm.ACTION_TOGGLE";
              public static final String ACTION_PREV = "com.sagar.airfm.ACTION_PREV";
              public static final String ACTION_NEXT = "com.sagar.airfm.ACTION_NEXT";
              public static final String ACTION_REWIND = "com.sagar.airfm.ACTION_REWIND";
              public static final String ACTION_FORWARD = "com.sagar.airfm.ACTION_FORWARD";

              private ExoPlayer player;
              private MediaSessionCompat mediaSession;
              private String currentTitle = "AIR FM Rainbow 102.6";
              private String currentSub = "Live Broadcast";
              private boolean isLiveStream = true;
              private long activeDurationMs = 0;
              private final IBinder binder = new LocalBinder();
              private final Handler timeHandler = new Handler(Looper.getMainLooper());
              private ProgressCallback progressCallback;
              private ActionListener actionListener;

              public interface ProgressCallback {
                  void onProgress(long currentMs, long durationMs, boolean isPlaying);
              }

              public interface ActionListener {
                  void onAction(String action);
              }

              public class LocalBinder extends Binder {
                  public RadioService getService() { return RadioService.this; }
              }

              public void setProgressCallback(ProgressCallback callback) {
                  this.progressCallback = callback;
              }

              public void setActionListener(ActionListener listener) {
                  this.actionListener = listener;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();

                  mediaSession = new MediaSessionCompat(this, "AirFmMediaSession");
                  mediaSession.setFlags(MediaSessionCompat.FLAG_HANDLES_MEDIA_BUTTONS | MediaSessionCompat.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  mediaSession.setCallback(new MediaSessionCompat.Callback() {
                      @Override
                      public void onPlay() { toggle(); }
                      @Override
                      public void onPause() { toggle(); }
                      @Override
                      public void onSkipToNext() { triggerAction("next"); }
                      @Override
                      public void onSkipToPrevious() { triggerAction("prev"); }
                      @Override
                      public void onFastForward() { seekDelta(10000); }
                      @Override
                      public void onRewind() { seekDelta(-10000); }
                      @Override
                      public void onSeekTo(long pos) { seekTo(pos); }
                  });
                  mediaSession.setActive(true);

                  // 1. Android 14/15 Multi-App Volume Mixer Support
                  // Registers STREAM_MUSIC to ensure Android sound panel assigns an app volume slider
                  AudioAttributes audioAttributes = new AudioAttributes.Builder()
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .setUsage(C.USAGE_MEDIA)
                          .setAllowedCapturePolicy(C.ALLOW_CAPTURE_BY_ALL)
                          .build();

                  player = new ExoPlayer.Builder(this)
                          .setAudioAttributes(audioAttributes, false) // False keeps dual-audio mixing enabled
                          .build();

                  player.addListener(new Player.Listener() {
                      @Override
                      public void onIsPlayingChanged(boolean isPlaying) {
                          updatePlaybackState(isPlaying);
                          updateNotification(isPlaying);
                      }

                      @Override
                      public void onPlaybackStateChanged(int playbackState) {
                          if (playbackState == Player.STATE_READY) {
                              long dur = player.getDuration();
                              if (dur > 0 && !isLiveStream) {
                                  activeDurationMs = dur;
                              }
                              updateMetadata();
                              updatePlaybackState(player.isPlaying());
                          }
                      }
                  });

                  updateMetadata();
                  updatePlaybackState(false);
                  startForeground(101, buildMediaNotification(false));
                  startTimeLoop();
              }

              private void startTimeLoop() {
                  timeHandler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              long cur = player.getCurrentPosition();
                              long dur = player.getDuration();

                              if (!isLiveStream && dur > 0 && dur != activeDurationMs) {
                                  activeDurationMs = dur;
                                  updateMetadata();
                              }

                              if (progressCallback != null) {
                                  progressCallback.onProgress(cur, activeDurationMs, player.isPlaying());
                              }

                              // Keep media session state and position in continuous sync for system notification seekbar
                              if (player.isPlaying() && !isLiveStream) {
                                  updatePlaybackState(true);
                              }
                          }
                          timeHandler.postDelayed(this, 1000);
                      }
                  }, 1000);
              }

              public void playUrl(String streamUrl, String title, String sub, boolean isLive) {
                  this.currentTitle = (title != null && !title.isEmpty()) ? title : "AIR FM Rainbow";
                  this.currentSub = (sub != null && !sub.isEmpty()) ? sub : "Broadcast";
                  this.isLiveStream = isLive;
                  this.activeDurationMs = isLive ? -1 : 3600000; // 1 hour (3600s) default for archives

                  updateMetadata();

                  if (player != null) {
                      player.stop();
                      player.clearMediaItems();
                      player.setMediaItem(MediaItem.fromUri(streamUrl));
                      player.prepare();
                      player.play();
                  }
              }

              public void toggle() {
                  if (player != null) {
                      if (player.isPlaying()) player.pause();
                      else player.play();
                  }
              }

              public void seekTo(long targetMs) {
                  if (player != null && !isLiveStream) {
                      player.seekTo(targetMs);
                      updatePlaybackState(player.isPlaying());
                  }
              }

              public void seekDelta(long deltaMs) {
                  if (player != null && !isLiveStream) {
                      long target = Math.max(0, player.getCurrentPosition() + deltaMs);
                      if (activeDurationMs > 0) {
                          target = Math.min(target, activeDurationMs);
                      }
                      player.seekTo(target);
                      updatePlaybackState(player.isPlaying());
                  }
              }

              public void setSpeed(float speed) {
                  if (player != null) {
                      player.setPlaybackParameters(new PlaybackParameters(speed));
                      updatePlaybackState(player.isPlaying());
                  }
              }

              public void setVolumeLevel(float volume) {
                  if (player != null) {
                      player.setVolume(Math.max(0.0f, Math.min(1.0f, volume)));
                  }
              }

              private void triggerAction(String act) {
                  if (actionListener != null) {
                      actionListener.onAction(act);
                  }
              }

              private void updateMetadata() {
                  long notifDuration = isLiveStream ? -1 : (activeDurationMs > 0 ? activeDurationMs : 3600000);
                  MediaMetadataCompat.Builder meta = new MediaMetadataCompat.Builder()
                          .putString(MediaMetadataCompat.METADATA_KEY_TITLE, currentTitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, currentSub)
                          .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, notifDuration);

                  mediaSession.setMetadata(meta.build());
              }

              // 2. Notification Seekbar Synced with Actual Current Time & Full Length
              private void updatePlaybackState(boolean isPlaying) {
                  long actions = PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE |
                          PlaybackStateCompat.ACTION_PLAY_PAUSE | PlaybackStateCompat.ACTION_SKIP_TO_NEXT |
                          PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS;

                  if (!isLiveStream) {
                      actions |= PlaybackStateCompat.ACTION_SEEK_TO | PlaybackStateCompat.ACTION_FAST_FORWARD | PlaybackStateCompat.ACTION_REWIND;
                  }

                  int state = isPlaying ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED;
                  long currentPos = player != null ? player.getCurrentPosition() : 0;
                  float currentSpeed = (player != null && isPlaying) ? player.getPlaybackParameters().speed : 0.0f;

                  mediaSession.setPlaybackState(new PlaybackStateCompat.Builder()
                          .setActions(actions)
                          .setState(state, currentPos, currentSpeed)
                          .build());
              }

              private void updateNotification(boolean isPlaying) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      nm.notify(101, buildMediaNotification(isPlaying));
                  }
              }

              private Notification buildMediaNotification(boolean isPlaying) {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent piOpen = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent piPrev = PendingIntent.getService(this, 1, new Intent(this, RadioService.class).setAction(ACTION_PREV), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent piRewind = PendingIntent.getService(this, 2, new Intent(this, RadioService.class).setAction(ACTION_REWIND), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent piToggle = PendingIntent.getService(this, 3, new Intent(this, RadioService.class).setAction(ACTION_TOGGLE), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent piForward = PendingIntent.getService(this, 4, new Intent(this, RadioService.class).setAction(ACTION_FORWARD), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent piNext = PendingIntent.getService(this, 5, new Intent(this, RadioService.class).setAction(ACTION_NEXT), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  int actionIcon = isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;

                  return new NotificationCompat.Builder(this, "radio_media_channel")
                          .setContentTitle(currentTitle)
                          .setContentText(currentSub)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(piOpen)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .addAction(android.R.drawable.ic_media_previous, "Previous", piPrev)
                          .addAction(android.R.drawable.ic_media_rew, "Rewind", piRewind)
                          .addAction(actionIcon, isPlaying ? "Pause" : "Play", piToggle)
                          .addAction(android.R.drawable.ic_media_ff, "Forward", piForward)
                          .addAction(android.R.drawable.ic_media_next, "Next", piNext)
                          .setStyle(new androidx.media.app.NotificationCompat.MediaStyle()
                                  .setMediaSession(mediaSession.getSessionToken())
                                  .setShowActionsInCompactView(1, 2, 3))
                          .build();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                              "radio_media_channel",
                              "Radio Media Player",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null) {
                      switch (intent.getAction()) {
                          case ACTION_TOGGLE: toggle(); break;
                          case ACTION_REWIND: seekDelta(-10000); break;
                          case ACTION_FORWARD: seekDelta(10000); break;
                          case ACTION_PREV: triggerAction("prev"); break;
                          case ACTION_NEXT: triggerAction("next"); break;
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  timeHandler.removeCallbacksAndMessages(null);
                  if (player != null) player.release();
                  if (mediaSession != null) mediaSession.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return binder; }
          }
          EOF

          # 7. MainActivity.java
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/MainActivity.java
          package com.sagar.airfm;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private RadioService service;
              private boolean bound = false;

              private final ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder b) {
                      service = ((RadioService.LocalBinder) b).getService();
                      bound = true;
                      service.setProgressCallback((currentMs, durationMs, isPlaying) -> {
                          runOnUiThread(() -> {
                              if (webView != null) {
                                  webView.evaluateJavascript("if(window.onNativeProgressSync) window.onNativeProgressSync(" + currentMs + "," + durationMs + "," + isPlaying + ");", null);
                              }
                          });
                      });
                      service.setActionListener((action) -> {
                          runOnUiThread(() -> {
                              if (webView != null) {
                                  webView.evaluateJavascript("if(window.handleNativeAction) window.handleNativeAction('" + action + "');", null);
                              }
                          });
                      });
                  }
                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      bound = false;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  Intent intent = new Intent(this, RadioService.class);
                  startForegroundService(intent);
                  bindService(intent, conn, Context.BIND_AUTO_CREATE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void play(String url, String title, String sub, boolean isLive) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.playUrl(url, title, sub, isLive);
                          });
                      }

                      @JavascriptInterface
                      public void toggle() {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.toggle();
                          });
                      }

                      @JavascriptInterface
                      public void seekTo(long targetMs) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.seekTo(targetMs);
                          });
                      }

                      @JavascriptInterface
                      public void seekDelta(long deltaMs) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.seekDelta(deltaMs);
                          });
                      }

                      @JavascriptInterface
                      public void setPlaybackSpeed(float speed) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.setSpeed(speed);
                          });
                      }

                      @JavascriptInterface
                      public void setVolume(float volume) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.setVolumeLevel(volume);
                          });
                      }
                  }, "NativeAudioBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (bound) unbindService(conn);
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          # 8. EMBEDDED ORIGINAL HTML (Exact original UI, clean & complete)
          cat << 'EOF' > native_app/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>AIR FM Rainbow 102.6 &bull; Live &amp; Archive</title>
            
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com">
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
            <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

            <style>
              :root {
                --bg: #090d16;
                --bg-gradient: radial-gradient(circle at 50% -20%, #152238 0%, #090d16 70%, #05070b 100%);
                --card-bg: rgba(18, 25, 38, 0.78);
                --card-border: rgba(255, 255, 255, 0.08);
                --card-border-active: rgba(59, 130, 246, 0.45);
                --yt-red: #ff0033;
                --live-glow: rgba(255, 0, 51, 0.45);
                --accent: #3b82f6;
                --accent-glow: rgba(59, 130, 246, 0.35);
                --text-main: #f8fafc;
                --text-dim: #94a3b8;
                --text-muted: #64748b;
                --radius-xl: 20px;
                --radius-lg: 14px;
                --radius-md: 10px;
                --radius-pill: 9999px;
              }

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
              }

              body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                background: var(--bg);
                background-image: var(--bg-gradient);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                padding: 12px 12px 32px;
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
              }

              .app-viewport {
                width: 100%;
                max-width: 520px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                position: relative;
              }

              header {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border: 1px solid var(--card-border);
                border-radius: var(--radius-lg);
                padding: 12px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
              }

              .brand-title {
                font-size: 1.1rem;
                font-weight: 800;
                letter-spacing: -0.02em;
                background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }

              .brand-sub { font-size: 0.72rem; color: var(--text-dim); font-weight: 500; }

              .badge-freq {
                background: rgba(59, 130, 246, 0.12);
                border: 1px solid rgba(59, 130, 246, 0.35);
                color: #60a5fa;
                padding: 4px 10px;
                border-radius: var(--radius-pill);
                font-size: 0.72rem;
                font-family: 'JetBrains Mono', monospace;
                font-weight: 700;
              }

              .player-deck {
                background: var(--card-bg);
                backdrop-filter: blur(25px);
                border: 1px solid var(--card-border);
                border-radius: var(--radius-xl);
                padding: 18px 18px 20px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
                position: relative;
              }

              .deck-top-row { display: flex; justify-content: space-between; align-items: center; }

              .live-chip-btn {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                padding: 6px 14px;
                border-radius: var(--radius-pill);
                font-size: 0.72rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                cursor: pointer;
                background: rgba(30, 41, 59, 0.8);
                border: 1px solid var(--card-border);
                color: var(--text-dim);
                transition: all 0.2s ease;
              }

              .live-chip-btn .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }

              .live-chip-btn.active {
                background: rgba(255, 0, 51, 0.16);
                border-color: rgba(255, 0, 51, 0.55);
                color: var(--yt-red);
                box-shadow: 0 0 16px var(--live-glow);
              }

              .live-chip-btn.active .pulse-dot {
                background: var(--yt-red);
                box-shadow: 0 0 10px var(--yt-red);
                animation: live-pulse 1.5s infinite ease-out;
              }

              @keyframes live-pulse {
                0% { transform: scale(0.9); opacity: 1; }
                50% { transform: scale(1.35); opacity: 0.35; }
                100% { transform: scale(0.9); opacity: 1; }
              }

              .mode-indicator { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--text-muted); text-transform: uppercase; }
              .track-meta { display: flex; flex-direction: column; gap: 3px; }
              .track-title { font-size: 1.25rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .track-subtitle { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }

              .touch-deck-screen {
                position: relative;
                width: 100%;
                height: 95px;
                border-radius: var(--radius-lg);
                background: rgba(8, 12, 20, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.05);
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: none;
              }

              #visualizerCanvas { width: 100%; height: 100%; display: block; pointer-events: none; }

              .skip-half { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
              .skip-half.left { left: 0; }
              .skip-half.right { right: 0; }

              .skip-ripple {
                position: absolute;
                width: 76px;
                height: 76px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.18);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                opacity: 0;
                pointer-events: none;
                transform: scale(0.6);
                transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.28s ease;
              }

              .skip-ripple.show { opacity: 1; transform: scale(1); }
              .skip-ripple span { font-size: 0.75rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #fff; }

              .yt-scrub-container { position: relative; padding: 10px 0 6px; cursor: pointer; touch-action: none; }
              .yt-scrub-track { position: relative; height: 5px; background: rgba(255, 255, 255, 0.14); border-radius: 4px; transition: height 0.12s ease; }
              .yt-scrub-container:hover .yt-scrub-track, .yt-scrub-container.is-scrubbing .yt-scrub-track { height: 8px; }
              .yt-scrub-buffered { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: rgba(255, 255, 255, 0.3); border-radius: 4px; pointer-events: none; }
              .yt-scrub-played { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--yt-red); border-radius: 4px; pointer-events: none; }
              .yt-scrub-thumb { position: absolute; top: 50%; left: 0%; width: 14px; height: 14px; background: var(--yt-red); border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(1); pointer-events: none; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); }

              .scrub-tooltip {
                position: absolute;
                bottom: 26px;
                left: 0;
                transform: translateX(-50%);
                background: rgba(15, 23, 42, 0.95);
                border: 1px solid rgba(255, 255, 255, 0.18);
                color: #fff;
                font-size: 0.72rem;
                font-family: 'JetBrains Mono', monospace;
                font-weight: 700;
                padding: 3px 8px;
                border-radius: 6px;
                pointer-events: none;
                display: none;
                white-space: nowrap;
              }

              .time-strip { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

              /* Action Deck: Shuffle, Prev, Master Play, Next, Repeat */
              .deck-action-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
              .circle-icon-btn { background: transparent; border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.15s ease; }
              .circle-icon-btn:active { transform: scale(0.9); color: #fff; }
              .circle-icon-btn.active { color: #60a5fa; }
              .circle-icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

              .master-toggle-btn {
                width: 58px;
                height: 58px;
                border-radius: 50%;
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                border: 1px solid rgba(255, 255, 255, 0.25);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: 0 6px 20px var(--accent-glow);
              }
              .master-toggle-btn svg { width: 24px; height: 24px; fill: #fff; margin-left: 2px; }
              .master-toggle-btn.is-playing svg { margin-left: 0; }

              .deck-sub-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
              .volume-box { display: flex; align-items: center; gap: 8px; width: 48%; }
              .volume-box svg { width: 17px; height: 17px; fill: var(--text-muted); flex-shrink: 0; }
              .volume-slider { -webkit-appearance: none; width: 100%; height: 4px; border-radius: var(--radius-pill); background: rgba(255, 255, 255, 0.1); outline: none; }
              .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }

              .speed-pill-btn { display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); border-radius: var(--radius-pill); padding: 5px 12px; font-size: 0.72rem; font-weight: 700; color: var(--text-dim); cursor: pointer; }
              .speed-pill-btn.locked { opacity: 0.5; cursor: not-allowed; }

              .toast-alert { display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: var(--radius-md); padding: 12px 14px; gap: 10px; align-items: center; }
              .toast-alert p { font-size: 0.78rem; color: #fca5a5; line-height: 1.35; flex: 1; }
              .toast-alert button { background: #ef4444; border: none; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer; }

              .date-panel {
                background: var(--card-bg);
                backdrop-filter: blur(16px);
                border: 1px solid var(--card-border);
                border-radius: var(--radius-lg);
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
              }

              .quick-chips-row { display: flex; gap: 8px; }
              .chip-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-dim); font-size: 0.75rem; font-weight: 600; padding: 7px 10px; border-radius: var(--radius-pill); cursor: pointer; text-align: center; }
              .chip-btn.active { background: var(--accent); border-color: #60a5fa; color: #fff; }

              .calendar-stepper { display: flex; align-items: center; gap: 8px; }
              .calendar-step-btn { width: 42px; height: 42px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
              .calendar-step-btn:active { background: rgba(255, 255, 255, 0.12); }

              input[type="date"] {
                flex: 1;
                height: 42px;
                background: rgba(10, 14, 22, 0.85);
                border: 1px solid var(--card-border);
                border-radius: var(--radius-md);
                color: #fff;
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.85rem;
                font-weight: 600;
                text-align: center;
                outline: none;
                padding: 0 8px;
                cursor: pointer;
              }

              .timeline-container { display: flex; flex-direction: column; gap: 8px; }
              .section-label-row { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
              .section-label { font-size: 0.76rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
              .sweep-action-btn { background: transparent; border: none; color: #60a5fa; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
              .sweep-action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

              .timeline-track { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; scroll-snap-type: x mandatory; }
              .timeline-track::-webkit-scrollbar { display: none; }
              .slot-card { scroll-snap-align: start; flex: 0 0 110px; height: 72px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 9px 8px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
              .slot-card.active { background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(30, 58, 138, 0.5)); border-color: #60a5fa; }
              .slot-num-badge { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); }
              .slot-card.active .slot-num-badge { color: #93c5fd; }
              .slot-time-text { font-size: 0.8rem; font-weight: 700; color: #fff; }
              .slot-desc { font-size: 0.68rem; color: var(--text-dim); }
            </style>
          </head>
          <body>

          <div class="app-viewport">
            <header>
              <div>
                <h1 class="brand-title">AIR FM Rainbow</h1>
                <p class="brand-sub">Delhi &bull; Live &amp; 30-Day Archive</p>
              </div>
              <span class="badge-freq">102.6 MHz</span>
            </header>

            <div class="player-deck">
              <div class="deck-top-row">
                <button id="livePillBtn" class="live-chip-btn active" onclick="switchToLiveMode()">
                  <span class="pulse-dot"></span> LIVE
                </button>
                <span id="streamStateLabel" class="mode-indicator">Live Broadcast</span>
              </div>

              <div class="track-meta">
                <div id="trackHeadline" class="track-title">AIR FM Rainbow Delhi (102.6 MHz)</div>
                <div id="trackSubtitle" class="track-subtitle">Real-time live edge broadcast</div>
              </div>

              <div id="touchDeckScreen" class="touch-deck-screen">
                <canvas id="visualizerCanvas"></canvas>
                <div class="skip-half left" id="skipHalfLeft">
                  <div id="rippleLeft" class="skip-ripple">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                    <span>-10s</span>
                  </div>
                </div>
                <div class="skip-half right" id="skipHalfRight">
                  <div id="rippleRight" class="skip-ripple">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
                    <span>+10s</span>
                  </div>
                </div>
              </div>

              <div id="ytScrubContainer" class="yt-scrub-container">
                <div id="scrubTooltip" class="scrub-tooltip">00:00</div>
                <div class="yt-scrub-track">
                  <div id="bufferBar" class="yt-scrub-buffered"></div>
                  <div id="progressBar" class="yt-scrub-played"></div>
                  <div id="scrubThumb" class="yt-scrub-thumb"></div>
                </div>
                <div class="time-strip">
                  <span id="currentTimeDisplay">00:00</span>
                  <span id="totalDurationDisplay">LIVE</span>
                </div>
              </div>

              <!-- Deck Action Controls: Shuffle, Prev, Master Play, Next, Repeat -->
              <div class="deck-action-row">
                <button class="circle-icon-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle Mode">
                  <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>

                <button class="circle-icon-btn" onclick="playPrevious()" title="Previous Slot">
                  <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button id="masterPlayBtn" class="master-toggle-btn" onclick="togglePlayPause()">
                  <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                  <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>

                <button class="circle-icon-btn" onclick="playNext()" title="Next Slot">
                  <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                <button class="circle-icon-btn" id="btnRepeat" onclick="cycleRepeatMode()" title="Repeat Mode">
                  <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
              </div>

              <!-- Volume & Speed Controls -->
              <div class="deck-sub-row">
                <div class="volume-box">
                  <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                  <input type="range" id="volRange" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)">
                </div>

                <div id="speedPill" class="speed-pill-btn locked" onclick="cyclePlaybackSpeed()">
                  <span id="speedLabel">1.0x</span>
                </div>
              </div>
            </div>

            <div id="toastAlert" class="toast-alert">
              <p id="toastMessage">Recording not found for this date &amp; hour.</p>
              <button onclick="switchToLiveMode()">Go Live</button>
            </div>

            <div class="date-panel">
              <div class="quick-chips-row">
                <button class="chip-btn active" id="chipToday" onclick="applyQuickDate(0)">Today</button>
                <button class="chip-btn" id="chipYesterday" onclick="applyQuickDate(1)">Yesterday</button>
              </div>

              <div class="calendar-stepper">
                <button class="calendar-step-btn" onclick="stepCalendarDay(-1)" title="Previous Day">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <input type="date" id="dateInput" onchange="onDateManualChange()">
                <button class="calendar-step-btn" onclick="stepCalendarDay(1)" title="Next Day">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
              </div>
            </div>

            <div class="timeline-container">
              <div class="section-label-row">
                <span class="section-label">Hourly Timeline (07 AM &ndash; 07 PM IST)</span>
                <button id="sweepNextBtn" class="sweep-action-btn" onclick="playNext()" disabled>
                  Sweep Next &rarr;
                </button>
              </div>
              <div class="timeline-track" id="timelineTrack"></div>
            </div>

            <audio id="coreAudio" playsinline preload="none"></audio>
          </div>

          <script>
            const REPO_OWNER = "sagarrawatssr";
            const REPO_NAME = "air-fm-recorder";
            const STREAM_URL = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";

            const coreAudio = document.getElementById("coreAudio");
            const masterPlayBtn = document.getElementById("masterPlayBtn");
            const playIcon = document.getElementById("playIcon");
            const pauseIcon = document.getElementById("pauseIcon");
            const livePillBtn = document.getElementById("livePillBtn");
            const streamStateLabel = document.getElementById("streamStateLabel");
            const trackHeadline = document.getElementById("trackHeadline");
            const trackSubtitle = document.getElementById("trackSubtitle");
            const sweepNextBtn = document.getElementById("sweepNextBtn");
            const ytScrubContainer = document.getElementById("ytScrubContainer");
            const progressBar = document.getElementById("progressBar");
            const scrubThumb = document.getElementById("scrubThumb");
            const scrubTooltip = document.getElementById("scrubTooltip");
            const currentTimeDisplay = document.getElementById("currentTimeDisplay");
            const totalDurationDisplay = document.getElementById("totalDurationDisplay");
            const speedPill = document.getElementById("speedPill");
            const speedLabel = document.getElementById("speedLabel");
            const toastAlert = document.getElementById("toastAlert");
            const toastMessage = document.getElementById("toastMessage");
            const dateInput = document.getElementById("dateInput");
            const timelineTrack = document.getElementById("timelineTrack");
            const canvas = document.getElementById("visualizerCanvas");
            const ctx = canvas.getContext("2d");

            let hlsInstance = null;
            let activeIndex = -1; 
            let currentSpeedIndex = 1;
            const speedOptions = [0.75, 1.0, 1.25, 1.5, 2.0];
            let isNativePlaying = false;
            let currentDurationSec = 3600;
            let currentPositionSec = 0;

            let repeatMode = 0; // 0 = Auto-Advance, 1 = Repeat Single, 2 = Off
            let isShuffle = false;

            const hourBlocks = [
              { label: "07 - 08 AM", file: "hour_00.mp3" },
              { label: "08 - 09 AM", file: "hour_01.mp3" },
              { label: "09 - 10 AM", file: "hour_02.mp3" },
              { label: "10 - 11 AM", file: "hour_03.mp3" },
              { label: "11 - 12 PM", file: "hour_04.mp3" },
              { label: "12 - 01 PM", file: "hour_05.mp3" },
              { label: "01 - 02 PM", file: "hour_06.mp3" },
              { label: "02 - 03 PM", file: "hour_07.mp3" },
              { label: "03 - 04 PM", file: "hour_08.mp3" },
              { label: "04 - 05 PM", file: "hour_09.mp3" },
              { label: "05 - 06 PM", file: "hour_10.mp3" },
              { label: "06 - 07 PM", file: "hour_11.mp3" }
            ];

            const now = new Date();
            const past30Days = new Date();
            past30Days.setDate(now.getDate() - 30);
            const toYMDString = (date) => date.toISOString().split("T")[0];

            dateInput.max = toYMDString(now);
            dateInput.min = toYMDString(past30Days);
            dateInput.value = toYMDString(now);

            hourBlocks.forEach((slot, idx) => {
              const card = document.createElement("div");
              card.className = "slot-card";
              card.id = `slot-card-${idx}`;
              card.innerHTML = `
                <span class="slot-num-badge">Slot ${idx + 1}</span>
                <div class="slot-time-text">${slot.label}</div>
                <div class="slot-desc">Archive Slice</div>
              `;
              card.onclick = () => playArchive(idx);
              timelineTrack.appendChild(card);
            });

            // Native Progress Sync
            window.onNativeProgressSync = function(curMs, durMs, isPlaying) {
              isNativePlaying = isPlaying;
              setPlayState(isPlaying);

              if (activeIndex === -1) {
                currentTimeDisplay.innerText = "00:00";
                totalDurationDisplay.innerText = "LIVE";
                progressBar.style.width = "100%";
                scrubThumb.style.left = "100%";
                return;
              }

              currentDurationSec = durMs > 0 ? (durMs / 1000) : 3600;
              currentPositionSec = Math.max(0, Math.min(curMs / 1000, currentDurationSec));
              currentTimeDisplay.innerText = formatSeconds(currentPositionSec);
              totalDurationDisplay.innerText = formatSeconds(currentDurationSec);

              if (!isScrubbing) {
                const pct = Math.min(100, Math.max(0, (currentPositionSec / currentDurationSec) * 100));
                progressBar.style.width = pct + "%";
                scrubThumb.style.left = pct + "%";
              }

              if (durMs > 0 && curMs >= durMs - 1200) {
                handleTrackEnd();
              }
            };

            window.handleNativeAction = function(action) {
              if (action === "next") playNext();
              else if (action === "prev") playPrevious();
            };

            function playViaNativeBridge(url, title, sub, isLive) {
              if (window.NativeAudioBridge) {
                toastAlert.style.display = "none";
                window.NativeAudioBridge.play(url, title, sub, isLive);
                isNativePlaying = true;
                setPlayState(true);
                return true;
              }
              return false;
            }

            function switchToLiveMode() {
              activeIndex = -1;
              clearTimelineHighlights();
              toastAlert.style.display = "none";

              livePillBtn.classList.add("active");
              streamStateLabel.innerText = "Live Broadcast";
              trackHeadline.innerText = "AIR FM Rainbow Delhi (102.6 MHz)";
              trackSubtitle.innerText = "Real-time live edge broadcast";
              sweepNextBtn.disabled = true;

              speedPill.classList.add("locked");
              speedLabel.innerText = "1.0x";
              if (window.NativeAudioBridge) window.NativeAudioBridge.setPlaybackSpeed(1.0);

              progressBar.style.width = "100%";
              scrubThumb.style.left = "100%";
              currentTimeDisplay.innerText = "00:00";
              totalDurationDisplay.innerText = "LIVE";

              const freshLiveUrl = `${STREAM_URL}?ts=${Date.now()}`;
              if (playViaNativeBridge(freshLiveUrl, "AIR FM Rainbow 102.6", "Live Broadcast", true)) return;
              loadSource(freshLiveUrl, true);
            }

            function playArchive(index) {
              activeIndex = index;
              clearTimelineHighlights();
              toastAlert.style.display = "none";

              const card = document.getElementById(`slot-card-${index}`);
              if (card) {
                card.classList.add("active");
                card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
              }

              livePillBtn.classList.remove("active");
              streamStateLabel.innerText = "Archive Mode";
              sweepNextBtn.disabled = false;

              const chosenDate = dateInput.value;
              const slot = hourBlocks[index];

              trackHeadline.innerText = `FM Rainbow: ${slot.label}`;
              trackSubtitle.innerText = `Recorded Archive • ${chosenDate}`;

              speedPill.classList.remove("locked");
              const chosenRate = speedOptions[currentSpeedIndex];
              speedLabel.innerText = `${chosenRate}x`;
              if (window.NativeAudioBridge) window.NativeAudioBridge.setPlaybackSpeed(chosenRate);

              currentPositionSec = 0;
              currentDurationSec = 3600;
              progressBar.style.width = "0%";
              scrubThumb.style.left = "0%";
              currentTimeDisplay.innerText = "00:00";
              totalDurationDisplay.innerText = "60:00";

              const fileUrl = `https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/archive-${chosenDate}/${chosenDate}_${hourBlocks[index].file}`;
              if (playViaNativeBridge(fileUrl, `FM Rainbow: ${slot.label}`, `Recorded Archive (${chosenDate})`, false)) return;
              loadSource(fileUrl, false);
            }

            function playNext() {
              if (activeIndex === -1) return;
              if (isShuffle) {
                playArchive(Math.floor(Math.random() * hourBlocks.length));
                return;
              }
              const nextIdx = (activeIndex + 1) % hourBlocks.length;
              playArchive(nextIdx);
            }

            function playPrevious() {
              if (activeIndex === -1) return;
              const prevIdx = (activeIndex - 1 + hourBlocks.length) % hourBlocks.length;
              playArchive(prevIdx);
            }

            function handleTrackEnd() {
              if (repeatMode === 1) playArchive(activeIndex);
              else if (repeatMode === 0) playNext();
            }

            function toggleShuffle() {
              isShuffle = !isShuffle;
              document.getElementById("btnShuffle").classList.toggle("active", isShuffle);
            }

            function cycleRepeatMode() {
              repeatMode = (repeatMode + 1) % 3;
              const btn = document.getElementById("btnRepeat");
              if (repeatMode === 0) {
                btn.classList.add("active");
                btn.title = "Auto-Advance Slots";
              } else if (repeatMode === 1) {
                btn.classList.add("active");
                btn.title = "Repeat Current Slot (Repeat 1)";
              } else {
                btn.classList.remove("active");
                btn.title = "Repeat Off";
              }
            }

            function changeVolume(val) {
              const vol = parseFloat(val);
              if (window.NativeAudioBridge) {
                window.NativeAudioBridge.setVolume(vol);
              } else {
                coreAudio.volume = vol;
              }
            }

            function cyclePlaybackSpeed() {
              if (activeIndex === -1) return;
              currentSpeedIndex = (currentSpeedIndex + 1) % speedOptions.length;
              const newRate = speedOptions[currentSpeedIndex];
              speedLabel.innerText = `${newRate}x`;
              if (window.NativeAudioBridge) {
                window.NativeAudioBridge.setPlaybackSpeed(newRate);
              } else {
                coreAudio.playbackRate = newRate;
              }
            }

            function loadSource(url, isLive) {
              if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
              }

              if (isLive) {
                if (Hls.isSupported()) {
                  hlsInstance = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
                  hlsInstance.loadSource(url);
                  hlsInstance.attachMedia(coreAudio);
                  hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    coreAudio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
                  });
                } else if (coreAudio.canPlayType("application/vnd.apple.mpegurl")) {
                  coreAudio.src = url;
                  coreAudio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
                }
              } else {
                coreAudio.src = url;
                coreAudio.playbackRate = speedOptions[currentSpeedIndex];
                coreAudio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
              }
            }

            function togglePlayPause() {
              if (window.NativeAudioBridge) {
                window.NativeAudioBridge.toggle();
                return;
              }
              if (coreAudio.paused) {
                coreAudio.play().then(() => setPlayState(true)).catch(() => {});
              } else {
                coreAudio.pause();
                setPlayState(false);
              }
            }

            function setPlayState(isPlaying) {
              playIcon.style.display = isPlaying ? "none" : "block";
              pauseIcon.style.display = isPlaying ? "block" : "none";
              masterPlayBtn.classList.toggle("is-playing", isPlaying);
            }

            function stepAudio(seconds) {
              if (activeIndex === -1) return;
              if (window.NativeAudioBridge) {
                window.NativeAudioBridge.seekDelta(seconds * 1000);
                return;
              }
              coreAudio.currentTime = Math.max(0, Math.min(coreAudio.duration || 0, coreAudio.currentTime + seconds));
            }

            function formatSeconds(sec) {
              if (isNaN(sec) || !isFinite(sec)) return "00:00";
              const m = Math.floor(sec / 60);
              const s = Math.floor(sec % 60);
              return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }

            function clearTimelineHighlights() {
              document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("active"));
            }

            function applyQuickDate(daysAgo) {
              const d = new Date();
              d.setDate(d.getDate() - daysAgo);
              dateInput.value = toYMDString(d);
              updateQuickChipStyles();
              if (activeIndex >= 0) playArchive(activeIndex);
            }

            function updateQuickChipStyles() {
              const selected = dateInput.value;
              const todayStr = toYMDString(now);
              const yest = new Date(); yest.setDate(yest.getDate() - 1);
              const yestStr = toYMDString(yest);

              document.getElementById("chipToday").classList.toggle("active", selected === todayStr);
              document.getElementById("chipYesterday").classList.toggle("active", selected === yestStr);
            }

            function stepCalendarDay(offset) {
              const cur = new Date(dateInput.value);
              cur.setDate(cur.getDate() + offset);
              if (cur >= past30Days && cur <= now) {
                dateInput.value = toYMDString(cur);
                updateQuickChipStyles();
                if (activeIndex >= 0) playArchive(activeIndex);
              }
            }

            function onDateManualChange() {
              updateQuickChipStyles();
              if (activeIndex >= 0) playArchive(activeIndex);
            }

            let isScrubbing = false;

            function handleScrubPointer(e) {
              if (activeIndex === -1) return;
              const rect = ytScrubContainer.getBoundingClientRect();
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const fraction = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
              const targetSec = fraction * currentDurationSec;

              progressBar.style.width = `${fraction * 100}%`;
              scrubThumb.style.left = `${fraction * 100}%`;
              scrubTooltip.style.display = "block";
              scrubTooltip.style.left = `${fraction * 100}%`;
              scrubTooltip.innerText = formatSeconds(targetSec);
              return targetSec;
            }

            ytScrubContainer.addEventListener("pointerdown", (e) => {
              if (activeIndex === -1) return;
              isScrubbing = true;
              const targetSec = handleScrubPointer(e);
              if (window.NativeAudioBridge) window.NativeAudioBridge.seekTo(targetSec * 1000);
            });

            window.addEventListener("pointermove", (e) => {
              if (!isScrubbing) return;
              const targetSec = handleScrubPointer(e);
              if (window.NativeAudioBridge) window.NativeAudioBridge.seekTo(targetSec * 1000);
            });

            window.addEventListener("pointerup", () => {
              if (isScrubbing) {
                isScrubbing = false;
                scrubTooltip.style.display = "none";
              }
            });

            document.getElementById("skipHalfLeft").addEventListener("click", () => {
              stepAudio(-10);
              const rip = document.getElementById("rippleLeft");
              rip.classList.add("show");
              setTimeout(() => rip.classList.remove("show"), 300);
            });

            document.getElementById("skipHalfRight").addEventListener("click", () => {
              stepAudio(10);
              const rip = document.getElementById("rippleRight");
              rip.classList.add("show");
              setTimeout(() => rip.classList.remove("show"), 300);
            });

            function resizeCanvas() {
              canvas.width = canvas.parentElement.clientWidth;
              canvas.height = canvas.parentElement.clientHeight;
            }
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            let phase = 0;
            function drawVisualizer() {
              requestAnimationFrame(drawVisualizer);
              ctx.clearRect(0, 0, canvas.width, canvas.height);

              const isPlaying = isNativePlaying || (!coreAudio.paused && coreAudio.currentTime > 0);
              const barCount = 32;
              const gap = 3;
              const barWidth = (canvas.width - gap * (barCount - 1)) / barCount;

              if (isPlaying) phase += 0.085;

              for (let i = 0; i < barCount; i++) {
                let h = 4;
                if (isPlaying) {
                  const wave1 = Math.sin(phase + i * 0.35);
                  const wave2 = Math.cos(phase * 0.75 + i * 0.2);
                  const amp = Math.abs(wave1 * 0.65 + wave2 * 0.35);
                  h = Math.max(4, amp * (canvas.height - 12));
                }

                const x = i * (barWidth + gap);
                const y = (canvas.height - h) / 2;

                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, activeIndex === -1 ? '#ff4d4d' : '#60a5fa');
                grad.addColorStop(1, activeIndex === -1 ? '#990000' : '#06b6d4');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, h, 2);
                ctx.fill();
              }
            }
            drawVisualizer();

            cycleRepeatMode();
            switchToLiveMode();
          </script>
          </body>
          </html>
          EOF

      - name: Build Standalone APK
        run: |
          cd native_app
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-Full-App
          path: native_app/app/build/outputs/apk/debug/*.apk
