<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AIR FM Rainbow 102.6 &bull; Live &amp; Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg: #090d16;
      --bg-gradient: radial-gradient(circle at 50% -20%, #152238 0%, #090d16 70%, #05070b 100%);
      --card-bg: rgba(18, 25, 38, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-active: rgba(59, 130, 246, 0.45);
      --yt-red: #ff0033;
      --live-glow: rgba(255, 0, 51, 0.45);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 12px 32px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-viewport {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub { font-size: 0.72rem; color: var(--text-dim); font-weight: 500; }

    .badge-freq {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .player-deck {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .deck-top-row { display: flex; justify-content: space-between; align-items: center; }

    .live-chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      transition: all 0.2s ease;
    }

    .live-chip-btn .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }

    .live-chip-btn.active {
      background: rgba(255, 0, 51, 0.16);
      border-color: rgba(255, 0, 51, 0.55);
      color: var(--yt-red);
      box-shadow: 0 0 16px var(--live-glow);
    }

    .live-chip-btn.active .pulse-dot {
      background: var(--yt-red);
      box-shadow: 0 0 10px var(--yt-red);
      animation: live-pulse 1.5s infinite ease-out;
    }

    @keyframes live-pulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.35; }
      100% { transform: scale(0.9); opacity: 1; }
    }

    .mode-indicator { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--text-muted); text-transform: uppercase; }
    .track-meta { display: flex; flex-direction: column; gap: 3px; }
    .track-title { font-size: 1.25rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-subtitle { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }

    .touch-deck-screen {
      position: relative;
      width: 100%;
      height: 95px;
      border-radius: var(--radius-lg);
      background: rgba(8, 12, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #visualizerCanvas { width: 100%; height: 100%; display: block; pointer-events: none; }

    .skip-half { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .skip-half.left { left: 0; }
    .skip-half.right { right: 0; }

    .skip-ripple {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
      transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.28s ease;
    }

    .skip-ripple.show { opacity: 1; transform: scale(1); }
    .skip-ripple span { font-size: 0.75rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #fff; }

    .yt-scrub-container { position: relative; padding: 10px 0 6px; cursor: pointer; touch-action: none; }
    .yt-scrub-track { position: relative; height: 5px; background: rgba(255, 255, 255, 0.14); border-radius: 4px; transition: height 0.12s ease; }
    .yt-scrub-container:hover .yt-scrub-track, .yt-scrub-container.is-scrubbing .yt-scrub-track { height: 8px; }
    .yt-scrub-buffered { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: rgba(255, 255, 255, 0.3); border-radius: 4px; pointer-events: none; }
    .yt-scrub-played { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--yt-red); border-radius: 4px; pointer-events: none; }
    .yt-scrub-thumb { position: absolute; top: 50%; left: 0%; width: 14px; height: 14px; background: var(--yt-red); border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%) scale(1); pointer-events: none; box-shadow: 0 0 8px rgba(0, 0, 0, 0.6); }

    .scrub-tooltip {
      position: absolute;
      bottom: 26px;
      left: 0;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    .time-strip { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

    /* Action Deck with Shuffle/Repeat & Track Skips */
    .deck-action-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
    .circle-icon-btn { background: transparent; border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.15s ease; }
    .circle-icon-btn:active { transform: scale(0.9); color: #fff; }
    .circle-icon-btn.active { color: #60a5fa; }
    .circle-icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .master-toggle-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .master-toggle-btn svg { width: 24px; height: 24px; fill: #fff; margin-left: 2px; }
    .master-toggle-btn.is-playing svg { margin-left: 0; }

    .deck-sub-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .volume-box { display: flex; align-items: center; gap: 8px; width: 48%; }
    .volume-box svg { width: 17px; height: 17px; fill: var(--text-muted); flex-shrink: 0; }
    .volume-slider { -webkit-appearance: none; width: 100%; height: 4px; border-radius: var(--radius-pill); background: rgba(255, 255, 255, 0.1); outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }

    .speed-pill-btn { display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); border-radius: var(--radius-pill); padding: 5px 12px; font-size: 0.72rem; font-weight: 700; color: var(--text-dim); cursor: pointer; }
    .speed-pill-btn.locked { opacity: 0.5; cursor: not-allowed; }

    .toast-alert { display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: var(--radius-md); padding: 12px 14px; gap: 10px; align-items: center; }
    .toast-alert p { font-size: 0.78rem; color: #fca5a5; line-height: 1.35; flex: 1; }
    .toast-alert button { background: #ef4444; border: none; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer; }

    /* Modern Bottom Sheet Calendar */
    .date-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-chips-row { display: flex; gap: 8px; }
    .chip-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-dim); font-size: 0.75rem; font-weight: 600; padding: 7px 10px; border-radius: var(--radius-pill); cursor: pointer; text-align: center; }
    .chip-btn.active { background: var(--accent); border-color: #60a5fa; color: #fff; }

    .calendar-trigger-btn {
      width: 100%;
      height: 42px;
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }

    .calendar-modal {
      width: 100%;
      max-width: 480px;
      background: #111827;
      border: 1px solid var(--card-border);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { font-size: 1rem; font-weight: 700; color: #fff; }
    .close-modal-btn { background: transparent; border: none; color: var(--text-dim); font-size: 1.3rem; cursor: pointer; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-weekday { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; padding-bottom: 4px; }
    .cal-day-cell { height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--text-main); }
    .cal-day-cell.inactive { opacity: 0.2; pointer-events: none; }
    .cal-day-cell.active { background: var(--accent); color: #fff; font-weight: bold; }

    /* Timeline Cards */
    .timeline-container { display: flex; flex-direction: column; gap: 8px; }
    .section-label-row { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    .section-label { font-size: 0.76rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
    .timeline-track { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .timeline-track::-webkit-scrollbar { display: none; }
    .slot-card { scroll-snap-align: start; flex: 0 0 110px; height: 72px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 9px 8px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .slot-card.active { background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(30, 58, 138, 0.5)); border-color: #60a5fa; }
    .slot-num-badge { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); }
    .slot-card.active .slot-num-badge { color: #93c5fd; }
    .slot-time-text { font-size: 0.8rem; font-weight: 700; color: #fff; }
    .slot-desc { font-size: 0.68rem; color: var(--text-dim); }
  </style>
</head>
<body>

<div class="app-viewport">
  <header>
    <div>
      <h1 class="brand-title">AIR FM Rainbow</h1>
      <p class="brand-sub">Delhi &bull; Live &amp; 30-Day Archive</p>
    </div>
    <span class="badge-freq">102.6 MHz</span>
  </header>

  <div class="player-deck">
    <div class="deck-top-row">
      <button id="livePillBtn" class="live-chip-btn active" onclick="switchToLiveMode()">
        <span class="pulse-dot"></span> LIVE
      </button>
      <span id="streamStateLabel" class="mode-indicator">Live Broadcast</span>
    </div>

    <div class="track-meta">
      <div id="trackHeadline" class="track-title">AIR FM Rainbow Delhi (102.6 MHz)</div>
      <div id="trackSubtitle" class="track-subtitle">Real-time live edge broadcast</div>
    </div>

    <div id="touchDeckScreen" class="touch-deck-screen">
      <canvas id="visualizerCanvas"></canvas>
      <div class="skip-half left" id="skipHalfLeft">
        <div id="rippleLeft" class="skip-ripple">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
          <span>-10s</span>
        </div>
      </div>
      <div class="skip-half right" id="skipHalfRight">
        <div id="rippleRight" class="skip-ripple">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
          <span>+10s</span>
        </div>
      </div>
    </div>

    <div id="ytScrubContainer" class="yt-scrub-container">
      <div id="scrubTooltip" class="scrub-tooltip">00:00</div>
      <div class="yt-scrub-track">
        <div id="bufferBar" class="yt-scrub-buffered"></div>
        <div id="progressBar" class="yt-scrub-played"></div>
        <div id="scrubThumb" class="yt-scrub-thumb"></div>
      </div>
      <div class="time-strip">
        <span id="currentTimeDisplay">00:00</span>
        <span id="totalDurationDisplay">LIVE</span>
      </div>
    </div>

    <!-- Complete Music Player Action Suite -->
    <div class="deck-action-row">
      <button class="circle-icon-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle Mode">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <button class="circle-icon-btn" onclick="playPrevious()" title="Previous Slot">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="masterPlayBtn" class="master-toggle-btn" onclick="togglePlayPause()">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="circle-icon-btn" onclick="playNext()" title="Next Slot">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <button class="circle-icon-btn" id="btnRepeat" onclick="cycleRepeatMode()" title="Repeat Mode">
        <svg id="repeatIcon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <!-- Volume & Speed Controls -->
    <div class="deck-sub-row">
      <div class="volume-box">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volRange" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)">
      </div>

      <div id="speedPill" class="speed-pill-btn locked" onclick="cyclePlaybackSpeed()">
        <span id="speedLabel">1.0x</span>
      </div>
    </div>
  </div>

  <div id="toastAlert" class="toast-alert">
    <p id="toastMessage">Recording not found for this date &amp; hour.</p>
    <button onclick="switchToLiveMode()">Go Live</button>
  </div>

  <!-- Modern Date Selection Panel -->
  <div class="date-panel">
    <div class="quick-chips-row">
      <button class="chip-btn active" id="chipToday" onclick="applyQuickDate(0)">Today</button>
      <button class="chip-btn" id="chipYesterday" onclick="applyQuickDate(1)">Yesterday</button>
    </div>

    <button class="calendar-trigger-btn" onclick="openCalendarModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      <span id="currentDateDisplayLabel">Select Broadcast Date</span>
    </button>
  </div>

  <!-- Modern Calendar Modal Sheet -->
  <div class="modal-overlay" id="calendarModal" onclick="closeCalendarModal(event)">
    <div class="calendar-modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3 id="calMonthTitle">Archive Calendar (Last 30 Days)</h3>
        <button class="close-modal-btn" onclick="closeCalendarModal()">&times;</button>
      </div>
      <div class="cal-grid" id="calendarDaysGrid"></div>
    </div>
  </div>

  <div class="timel
